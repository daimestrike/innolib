services:
  innolib:
    image: innolib:${INNOLIB_VERSION:-latest}
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
    container_name: innolib
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - innolib-data:/data

volumes:
  innolib-data:
