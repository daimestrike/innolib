name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"   # минимальная поддерживаемая версия
      - name: Запуск сервера и проверка API
        run: |
          DB_PATH=/tmp/t.sqlite3 PORT=8080 python3 app.py &
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 0.5; done
          curl -fs localhost:8080/api/cases | python3 -c "import json,sys; assert len(json.load(sys.stdin)['cases'])==16"
          curl -fs -X POST localhost:8080/api/cases -H 'Content-Type: application/json' -d '{"title":"CI"}' >/dev/null
          curl -fs localhost:8080/api/export.csv | grep -q CI
          curl -fs localhost:8080/ | grep -q "Библиотека инноваций"
          DB_PATH=/tmp/t.sqlite3 python3 app.py import data/import_template.csv
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VERSION=$(cat VERSION) -t innolib:ci .
