name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"   # минимальная поддерживаемая версия
      - name: Запуск сервера и проверка API
        run: |
          DB_PATH=/tmp/t.sqlite3 PORT=8080 python3 app.py &
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 0.5; done
          curl -fs localhost:8080/api/cases | python3 -c "import json,sys; assert len(json.load(sys.stdin)['cases'])==16"
          curl -fs -X POST localhost:8080/api/cases -H 'Content-Type: application/json' -d '{"title":"CI"}' >/dev/null
          curl -fs localhost:8080/api/export.csv | grep -q CI
          curl -fs localhost:8080/ | grep -q "Библиотека инноваций"
          DB_PATH=/tmp/t.sqlite3 python3 app.py import data/import_template.csv
          # база знаний и поиск
          curl -fs -X POST localhost:8080/api/docs -H 'Content-Type: application/json' \
            -d '{"title":"Регламент","text":"Пилот длится не более трёх месяцев, метрики фиксируются до старта."}' >/dev/null
          curl -fsG localhost:8080/api/search --data-urlencode "q=сколько длится пилот" | grep -q DOC-1
          curl -fsG localhost:8080/api/search --data-urlencode "q=потери на кассах" | grep -q INN-002
          # консультант без модели отдаёт найденные кейсы потоком
          curl -fsN -X POST localhost:8080/api/chat -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"что есть по антифроду"}]}' | grep -q '"type": "done"'
          # генератор идей без модели честно отвечает 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/ideas -H 'Content-Type: application/json' -d '{"topic":"списания"}')" = 503
          python3 -m py_compile app.py llm.py rag.py docs.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VERSION=$(cat VERSION) -t innolib:ci .
